<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>
</head>
<body>

    <h1>Student Registration</h1>
    <p>My First HTML Assignment</p>
    <hr>

    <form>
        <p>
            <label for="name">Student Name:</label><br>
            <input type="text" id="name" name="student" required>
        </p>

        <p>
            <label for="roll">Roll Number:</label><br>
            <input type="text" id="roll" name="roll">
        </p>

        <p>
            Gender:<br>
            <label>
                <input type="radio" name="gender" value="male"> Male
            </label>
            <label>
                <input type="radio" name="gender" value="female"> Female
            </label>
        </p>

        <p>
            Favourite Subjects:<br>
            <label>
                <input type="checkbox" name="subject" value="computer">
                Computer
            </label>
            <label>
                <input type="checkbox" name="subject" value="english">
                English
            </label>
            <label>
                <input type="checkbox" name="subject" value="math">
                Math
            </label>
        </p>

        <p>
            <label for="city">City:</label><br>
            <select id="city" name="city">
                <option>Lahore</option>
                <option>Sheikhupura</option>
                <option>Nankana Sahib</option>
                <option>Faisalabad</option>
            </select>
        </p>

        <p>
            <label for="address">Address:</label><br>
            <textarea id="address" name="address"
                      rows="3" cols="25"></textarea>
        </p>

        <input type="submit" value="Submit">
        <input type="reset" value="Clear">
    </form>

    <hr>
    <p>
        Search here:
        <a href="https://www.google.com">Google</a>
    </p>

</body>
</html>
